name: ML Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: Lint ───────────────────────────────────────────────────────────
  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on complexity and line length issues (non-blocking)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

  # ── Job 2: Test ───────────────────────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn xgboost pandas numpy joblib pytest

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  # ── Job 3: Model Validation ───────────────────────────────────────────────
  validate-model:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn xgboost pandas numpy joblib

      - name: Validate best_model.pkl can be loaded
        run: |
          python - <<'EOF'
          import joblib, os, sys
          model_path = "saved_models/best_model.pkl"
          if not os.path.exists(model_path):
              print(f"ERROR: {model_path} not found!")
              sys.exit(1)
          model = joblib.load(model_path)
          assert hasattr(model, 'predict'), "Loaded object is not a valid model"
          assert hasattr(model, 'predict_proba'), "Model missing predict_proba"
          print(f"Model loaded successfully: {type(model)}")
          print(f"Pipeline steps: {list(model.named_steps.keys())}")
          EOF

      - name: Check model performance thresholds
        run: |
          python - <<'EOF'
          import json, sys
          registry_path = "saved_models/model_registry_summary.json"
          with open(registry_path) as f:
              registry = json.load(f)
          metrics = registry["metrics"]
          print(f"Champion model: {registry['selected_model']}")
          print(f"  F1-Score : {metrics['f1']:.4f}")
          print(f"  ROC-AUC  : {metrics['roc_auc']:.4f}")
          print(f"  Recall   : {metrics['recall']:.4f}")
          # Enforce minimum performance gates
          MIN_F1      = 0.40
          MIN_ROC_AUC = 0.65
          MIN_RECALL  = 0.40
          failed = False
          if metrics['f1'] < MIN_F1:
              print(f"FAIL: F1={metrics['f1']:.4f} below minimum {MIN_F1}")
              failed = True
          if metrics['roc_auc'] < MIN_ROC_AUC:
              print(f"FAIL: ROC-AUC={metrics['roc_auc']:.4f} below minimum {MIN_ROC_AUC}")
              failed = True
          if metrics['recall'] < MIN_RECALL:
              print(f"FAIL: Recall={metrics['recall']:.4f} below minimum {MIN_RECALL}")
              failed = True
          if failed:
              sys.exit(1)
          print("All performance thresholds passed!")
          EOF

  # ── Job 4: Build Summary ──────────────────────────────────────────────────
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, test, validate-model]
    if: always()
    steps:
      - name: Print CI summary
        run: |
          echo "========================================"
          echo " Shopify Returns ML Pipeline CI Summary"
          echo "========================================"
          echo " Lint      : ${{ needs.lint.result }}"
          echo " Tests     : ${{ needs.test.result }}"
          echo " Model Val : ${{ needs.validate-model.result }}"
          echo "========================================"
